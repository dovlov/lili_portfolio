<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Liliana Apodaca</title>

<!--
  Favicon. Drop favicon.ico in beside this file and it works — no other change
  needed. The path is relative rather than "/favicon.ico" so it also resolves
  when you open index.html straight off disk to preview.

  If you later export a PNG or SVG version, add it ABOVE this line; browsers
  take the last format they understand, and modern ones prefer SVG/PNG:
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
-->
<link rel="icon" href="favicon.ico" sizes="any" />

<!-- Roboto Condensed for the hover tooltips (script.js draws them in that
     font at 26px/700); plain Roboto for the contact view. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!--
  Page title. pointer-events:none in CSS so it never blocks a grab.
  The face stays INSIDE the <h1> so the heading still reads as one name to a
  screen reader — it is only pulled to the opposite corner visually, by being
  position:fixed in its own right (a fixed child escapes its parent's box).
-->
<h1 class="site-title">LILIANA APODACA<span
    class="site-face"
    role="button"
    tabindex="0"
    aria-label="Contact"
  >&lt;:^~)</span></h1>

<!--
  Contact view. Deliberately NOT a separate page: navigating away and back
  would tear the simulation down and re-scatter the pile. This is an overlay,
  and the portfolio simply hides behind it, exactly as it was left.
-->
<section id="contact" class="contact" aria-label="Contact" hidden>
  <address class="contact-lines">
    <span class="contact-line">Liliana Apodaca</span>
    <a class="contact-line" href="mailto:lili.s.apodaca@gmail.com"
      >lili.s.apodaca@gmail.com</a
    >
    <a class="contact-line" href="tel:+14158470494">1-415-847-0494</a>
  </address>
</section>

<!--
  Every image becomes a <canvas class="sticker"> appended in here by script.js.
  The stage is the physics world; its walls are the edges of the browser window.
-->
<div id="stage" class="stage" aria-label="Draggable images"></div>

<!-- Shown only while you're dragging image files over the window. -->
<div id="dropHint" class="drop-hint" hidden>Drop images to add them</div>

<script src="script.js"></script>
</body>
</html>

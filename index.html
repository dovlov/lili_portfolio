<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Liliana Apodaca</title>

<!-- Roboto Condensed, for the hover tooltips (script.js draws them in this
     font at 26px/700). 400 is loaded too as a graceful fallback weight. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Page title. pointer-events:none in CSS so it never blocks a grab. -->
<h1 class="site-title">LILIANA APODACA &lt;:^~)</h1>

<!--
  Every image becomes a <canvas class="sticker"> appended in here by script.js.
  The stage is the physics world; its walls are the edges of the browser window.
-->
<div id="stage" class="stage" aria-label="Draggable images"></div>

<!-- Shown only while you're dragging image files over the window. -->
<div id="dropHint" class="drop-hint" hidden>Drop images to add them</div>

<script src="script.js"></script>
</body>
</html>
